# Builds the Windows app + installer on GitHub (free) every push.
# The installer and a portable zip are attached to a GitHub Release
# ("Releases" on the repo page) and to the run's "Artifacts" section.
name: Build Windows app

on:
  push:
    branches-ignore:
      - ci-logs
      - ci-test
    paths-ignore:
      - "android/**"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/android-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download AI engine (Real-ESRGAN)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile vendor/realesrgan.zip
          Expand-Archive vendor/realesrgan.zip -DestinationPath vendor/realesrgan -Force
          Remove-Item vendor/realesrgan.zip
          Get-ChildItem vendor/realesrgan -Include *.jpg,*.png,*.mp4 -Recurse | Remove-Item

      - name: Stamp the build number (shown in Help › About; used by "Check for updates")
        shell: pwsh
        run: '"BUILD = ${{ github.run_number }}" | Out-File -FilePath app/_build.py -Encoding ascii'

      - name: Unit tests
        run: python -m pytest -q tests

      - name: App self-test (from source)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -X faulthandler main.py --selftest *> selftest.log
          $code = $LASTEXITCODE
          Get-Content selftest.log
          if ($code -ne 0) {
            $msg = (Get-Content selftest.log -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=Self-test failed (exit code $code)::$msg"
            exit $code
          }

      # The click-everything robot (tools/robot.py): one fixed click order must pass, and a new one
      # each build looks for fresh problems (reported as a warning, so a release isn't held up).
      - name: Robot (fixed click order)
        timeout-minutes: 25
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -X faulthandler tools/robot.py --seed 1 --out robot-logs

      - name: Robot (new click order every build)
        timeout-minutes: 25
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -X faulthandler tools/robot.py --seed ${{ github.run_number }} --out robot-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-logs
          path: robot-logs/
          if-no-files-found: ignore

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm ImageResizeShare.spec

      # Optional: set the repository secrets WINDOWS_CERT_PFX_BASE64 (the .pfx file, base64) and
      # WINDOWS_CERT_PASSWORD to sign the app, installer and uninstaller (see README).
      - name: Code-signing certificate
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            "IRS_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "IRS_SIGN_PASSWORD=$env:CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Output "::warning::No WINDOWS_CERT_PFX_BASE64 secret - the app is not signed (Windows will say 'Unknown publisher')."
          }

      - name: Sign the app
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/sign.ps1 dist/ImageResizeShare/ImageResizeShare.exe

      - name: Self-test the built exe
        timeout-minutes: 10
        shell: pwsh
        run: |
          $p = Start-Process dist/ImageResizeShare/ImageResizeShare.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Built app self-test failed ($($p.ExitCode))" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if ($env:IRS_SIGN_PFX) {
            & $iscc /DSign "/Ssigntool=powershell -ExecutionPolicy Bypass -File $PWD\tools\sign.ps1 `$f" installer.iss
          } else {
            & $iscc installer.iss
          }
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ImageResizeShare-Setup
          path: dist/ImageResizeShare-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ImageResizeShare-portable
          path: dist/ImageResizeShare/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist/ImageResizeShare-Setup-*.exe | Select-Object -First 1
          Compress-Archive -Path dist/ImageResizeShare -DestinationPath dist/ImageResizeShare-portable.zip -Force
          $ver = (python -c "import app; print(app.__version__)").Trim()
          $tag = "windows-v$ver.${{ github.run_number }}"      # read by Help › Check for updates
          # latest.json: for "Check for updates" when the repository is private (see app/__init__.py)
          @{ version = $ver; build = ${{ github.run_number }}; url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag";
             notes = "Windows app $ver (build ${{ github.run_number }})" } | ConvertTo-Json | Out-File dist/latest.json -Encoding utf8
          gh release create $tag $setup.FullName dist/ImageResizeShare-portable.zip dist/latest.json `
            --target $env:GITHUB_SHA `
            --title "Windows app $ver (build ${{ github.run_number }})" `
            --notes "Image Resize & Share for Windows. ImageResizeShare-Setup-*.exe installs the app with Start-menu and desktop shortcuts and the right-click 'Edit with' menu. ImageResizeShare-portable.zip runs without installing: unzip and open ImageResizeShare.exe."
