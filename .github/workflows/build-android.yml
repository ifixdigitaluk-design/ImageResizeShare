# Builds the Android app (APK) on GitHub every time android/ changes.
# The signed APK is attached to a GitHub Release ("Releases" on the repo page)
# and to the run's "Artifacts" section.
name: Build Android app

on:
  push:
    branches-ignore:
      - ci-logs
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the APK is signed with a temporary debug key."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "ImageResizeShare-$VERSION_NAME.apk"

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -c 60000 > errors.txt || true
          head -n 40 errors.txt | while IFS= read -r line; do echo "::error::${line}"; done
          # Full log on the ci-logs branch (marked [skip ci] so nothing re-runs)
          mkdir -p "$RUNNER_TEMP/ci" && cp build.log errors.txt "$RUNNER_TEMP/ci/"
          cd "$RUNNER_TEMP/ci"
          git init -q && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android build log [skip ci]"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: ImageResizeShare-android
          path: android/ImageResizeShare-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$VERSION_NAME" "ImageResizeShare-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Android app $VERSION_NAME" \
            --notes "Image Resize & Share for Android. Download the APK below and open it on your phone to install (allow installs from this source when asked)."
