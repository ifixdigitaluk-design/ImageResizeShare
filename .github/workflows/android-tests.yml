# Runs the Android engine tests and a UI walk-through on an emulator.
# Start it from Actions -> "Android tests (emulator)" -> Run workflow.
# Screenshots of every screen and the test report are pushed to the
# "ci-logs" branch (android-tests/ folder).
name: Android tests (emulator)

on:
  push:
    branches:
      - ci-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
          echo "CPU virtualisation flags: $(grep -cE 'vmx|svm' /proc/cpuinfo)"

      - name: Build app and test APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > test.log 2>&1 || echo "TESTS_FAILED" >> test.log
            adb exec-out run-as uk.ifixdigital.imageresizeshare.debug tar c files/screens > screens.tar || true
            adb logcat -d -v time > logcat.txt || true

      - name: Publish results to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/out/android-tests"
          mkdir -p "$OUT"
          cd android
          cp build.log test.log "$OUT/" 2>/dev/null || true
          if [ -s screens.tar ]; then mkdir -p "$OUT/screens" && tar xf screens.tar -C "$OUT/screens" --strip-components=2 || true; fi
          [ -f logcat.txt ] && grep -E "AndroidRuntime|FATAL|uk.ifixdigital|TestRunner" logcat.txt | tail -n 3000 > "$OUT/logcat-app.txt" || true
          cp -r app/build/outputs/androidTest-results "$OUT/results" 2>/dev/null || true
          cd "$RUNNER_TEMP/out"
          git init -q && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android test results [skip ci]"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - name: Fail if tests failed
        working-directory: android
        run: |
          if grep -q TESTS_FAILED test.log; then
            grep -E "FAILED|Exception|Error" test.log | head -n 30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
