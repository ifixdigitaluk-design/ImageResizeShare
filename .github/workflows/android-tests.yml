# Runs the Android tests on GitHub: engine tests (ported from
# tests/test_imaging.py) and a UI walk-through that screenshots every screen.
# They run on the JVM with Robolectric (real Android graphics), so no emulator
# is needed. Start from Actions -> "Android tests" -> Run workflow.
# Screenshots and the test report are pushed to the "ci-logs" branch.
name: Android tests

on:
  push:
    branches:
      - ci-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log || echo "TESTS_FAILED" >> test.log

      - name: Publish results to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/out/android-tests"
          mkdir -p "$OUT"
          cd android
          cp test.log "$OUT/" 2>/dev/null || true
          cp -r app/build/screens "$OUT/screens" 2>/dev/null || true
          cp -r app/build/test-results/testDebugUnitTest "$OUT/results" 2>/dev/null || true
          cd "$RUNNER_TEMP/out"
          git init -q && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android test results [skip ci]"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - name: Fail if tests failed
        working-directory: android
        run: |
          if grep -q TESTS_FAILED test.log; then
            grep -E "FAILED|Exception|Error" test.log | head -n 30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
